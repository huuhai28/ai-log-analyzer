# Filebeat → Logstash → Elasticsearch (index portfolio-logs-YYYY.MM.dd)
input {
  beats { port => 5044 }
}

filter {
  # Tên service = tên service trong docker compose (backend, worker, frontend, keycloak, kong...)
  mutate {
    copy => { "[container][labels][com_docker_compose_service]" => "compose_service" }
  }

  # Log ứng dụng (FastAPI, Celery, nginx) đã là JSON một dòng → tách thành field có cấu trúc
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
      tag_on_failure => ["_json_parse_failure"]
    }
  }

  if ![service] { mutate { copy => { "compose_service" => "service" } } }

  # Chuẩn hóa mức độ log cho các service không ghi JSON (Keycloak, Postgres, Kong...)
  if ![level] {
    if [http.status_code] and [http.status_code] >= 500 {
      mutate { add_field => { "level" => "ERROR" } }
    } else if [http.status_code] and [http.status_code] >= 400 {
      mutate { add_field => { "level" => "WARNING" } }
    } else if [message] =~ /(?i)\b(error|exception|fatal|panic)\b/ {
      mutate { add_field => { "level" => "ERROR" } }
    } else if [message] =~ /(?i)\bwarn(ing)?\b/ {
      mutate { add_field => { "level" => "WARNING" } }
    } else {
      mutate { add_field => { "level" => "INFO" } }
    }
  }
  mutate { uppercase => ["level"] }

  # Bỏ bớt metadata của Beats cho gọn
  mutate {
    remove_field => ["agent", "ecs", "input", "event", "[container][labels]", "[log][offset]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "portfolio-logs-%{+YYYY.MM.dd}"
    data_stream => false
    manage_template => false
  }
}
