apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Elasticsearch logs
    uid: elasticsearch
    type: elasticsearch
    url: http://elasticsearch:9200
    editable: false
    jsonData:
      index: "portfolio-logs-*"
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
